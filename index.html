<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ПДД Казахстан — учебный тренажёр</title>
  <meta name="description" content="Подготовка к теоретическому экзамену по ПДД Республики Казахстан: правила по темам, учебные тесты с пояснениями, экзамен на время и личный прогресс. На русском и казахском языках.">
  <meta name="theme-color" content="#0a7fa4">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Применяем тему до отрисовки, чтобы не было вспышки светлого фона.
    try {
      var s = JSON.parse(localStorage.getItem('pdd-kz:v1') || '{}');
      var th = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = th;
      if (s.lang === 'kk') document.documentElement.lang = 'kk';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <p class="boot" role="status">Загрузка… / Жүктелуде…</p>
  </div>
  <noscript>
    <p class="boot">Для работы тренажёра включите JavaScript. / Тренажер жұмыс істеуі үшін JavaScript-ті қосыңыз.</p>
  </noscript>
</body>
</html>
